packages:
  - "apps/*"
  - "packages/*"
  - "lab"
  - "scripts"

# One version of each shared dependency, repo-wide. Ranges are loose on purpose: with the
# 3-day minimum release age below, pnpm picks the newest version that is at least 3 days
# old, and the lockfile pins it exactly.
catalog:
  # AI SDK 7 and its providers, for packages/agent's LLM adapters (ESM-only, Node 22+). Kept on
  # 7.0.x and 4.0.x, as the Phase 3 spec pins them.
  "@ai-sdk/anthropic": ~4.0.103
  "@ai-sdk/groq": ~4.0.82
  "@axe-core/playwright": ^4.10.0
  "@base-ui/react": ^1.9.0
  # Held at 1.7.x: packages/db's auth tables were generated by the 1.7.22 CLI.
  "@better-auth/passkey": ~1.7.22
  "@biomejs/biome": ^2.6.0
  # The Workers test runtime (renamed from @cloudflare/vitest-pool-workers, which is
  # deprecated). 1.4+ supports Vitest 4.1 and 5; its bundled workerd sets how new the
  # Workers' compatibility_date can be.
  "@cloudflare/vitest-plugin": ~1.8.1
  "@electric-sql/pglite": ^0.5.14
  "@electric-sql/pglite-pgtap": ^0.0.17
  "@electric-sql/pglite-pgvector": ^0.0.16
  "@neondatabase/serverless": ^1.2.0
  # Needs next >= 16.4.5 and wrangler ^4.148.
  "@opennextjs/cloudflare": ^1.20.15
  "@playwright/test": ^1.64.0
  "@tailwindcss/postcss": ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  "@types/node": ^26.0.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  # Storybook's browser-mode test runner; keep it on the same minor as vitest.
  "@vitest/browser-playwright": ^4.1.0
  ai: ~7.0.171
  babel-plugin-react-compiler: ^1.0.0
  better-auth: ~1.7.22
  drizzle-kit: ^0.31.0
  drizzle-orm: ^0.45.0
  hono: ^4.13.0
  jsonc-parser: ^3.3.1
  lucide-react: ^1.70.0
  next: ^16.4.5
  next-themes: ^0.4.6
  playwright: ^1.64.0
  react: ^19.3.0
  react-dom: ^19.3.0
  server-only: ^0.0.1
  tailwindcss: ^4.3.0
  tsx: ^4.20.0
  turbo: ^2.11.0
  # Not 7.0 yet: TypeScript 7.0 ships no compiler API until 7.1, and some tools need it.
  typescript: ~6.0.0
  vite: ^8.0.0
  vitest: ^4.1.0
  wrangler: ^4.148.0
  # packages/evals' test of the live smoke workflow reads .github/workflows/eval-smoke.yml.
  yaml: ^2.9.1
  zod: ^4.6.0

# Dependabot's three alerts (2026-11-25), each in a build-time tool that never reaches a Worker:
# esbuild's development server (GHSA-67mh-4wv8-2f99), through drizzle-kit's @esbuild-kit loader,
# which still pins esbuild 0.18; glob's AbortSignal bypass (GHSA-3g3m-2fjr-6pw4), through OpenNext
# and Storybook's docgen plugin; and minimatch's globparts amplification (GHSA-g3hv-75wg-m249),
# through glob and ts-morph. Drop each once its parent depends on a fixed version.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1

# Supply chain: wait 3 days before installing any newly published version.
minimumReleaseAge: 4320
# Refuse a version that was published with weaker trust evidence than earlier versions.
trustPolicy: no-downgrade
# pnpm 11+ fails the install when a dependency's install script hasn't been reviewed.
allowBuilds:
  esbuild: true
  # Via onnxruntime-web (packages/voice). Its postinstall only prints a version-scheme warning.
  protobufjs: false
  sharp: true
  workerd: true
