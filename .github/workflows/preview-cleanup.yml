name: preview-cleanup

# Tears down a PR's preview when it closes: the web Worker first (it binds to the edge
# Worker), then the edge Worker and its Durable Objects, then the Neon branch.
# Each step continues on error; janitor.yml catches anything left behind.

on:
  pull_request:
    types: [closed]

# Same per-PR group as preview.yml, so a deploy and a teardown never overlap. Closing a PR
# cancels a deploy that is still running; reopening during teardown cancels the teardown,
# and the new deploy recreates everything (create-branch-action is idempotent).
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  teardown:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    env:
      PR: ${{ github.event.pull_request.number }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # --force skips wrangler's confirmation prompts. It's in wrangler's source but not its docs.
      - name: Delete the web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true
        working-directory: apps/web
        run: pnpm exec wrangler delete --name "earshot-web-pr-$PR" --force

      - name: Delete the edge Worker and its Durable Objects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        continue-on-error: true
        working-directory: apps/edge
        run: pnpm exec wrangler delete --name "earshot-edge-pr-$PR" --force

      - name: Delete the Neon branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
