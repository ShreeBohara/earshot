name: release-please

# Opens and updates the release PR from Conventional Commit titles on main.
# The release PR stays open until v2.0-alpha (Phase 3). With the default GITHUB_TOKEN,
# release PRs don't trigger CI, so set RELEASE_PLEASE_TOKEN (a fine-grained token limited
# to this repo's contents and pull requests) to get checks on them.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
