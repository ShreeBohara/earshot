name: release-please

# Opens and updates the release PR from Conventional Commit titles on main. The release PR
# stays open until v2.0-alpha (Phase 3).
#
# Needs RELEASE_PLEASE_TOKEN: a fine-grained token limited to this repository with
# "Contents: read and write" and "Pull requests: read and write". The default GITHUB_TOKEN
# can't be used: this repo doesn't let GitHub Actions create pull requests, and PRs opened
# with GITHUB_TOKEN wouldn't trigger CI anyway. Until the secret exists, the job skips.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "RELEASE_PLEASE_TOKEN isn't set, so there's no release PR yet. See the comment at the top of this workflow."
      - if: env.HAS_TOKEN == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
