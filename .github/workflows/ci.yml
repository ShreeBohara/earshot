name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Install exactly what lab/uv.lock pins; never re-lock in CI.
  UV_FROZEN: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # turbo --affected compares against the base branch
          persist-credentials: false
      # A migration on the base branch may already have run against a database, and editing it
      # would leave that database out of step with the file (docs/adr/0019). New migration files
      # and changes under meta/ pass.
      - name: Merged migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changes=$(git diff --diff-filter=MDR --name-status "origin/${BASE_REF}...HEAD" -- 'packages/db/migrations/*.sql')
          if [ -n "$changes" ]; then
            while IFS=$'\t' read -r status file _; do
              echo "::error file=${file}::Migrations are immutable once merged, and ${file} is already on ${BASE_REF} (git status ${status}). Add a new migration instead of editing, renaming, or deleting it."
            done <<< "$changes"
            exit 1
          fi
          echo "No migration from ${BASE_REF} was edited, renamed, or deleted."
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project lab
      - name: Format and lint (Biome)
        run: pnpm ci:check
      - name: Lint, typecheck, test, build (including the OpenNext Worker bundle)
        run: pnpm turbo run lint typecheck test build build:worker ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      # Gate G1a (Phase 4 spec §6, WP5): linker v1 with the second witness on confusable.v1's test
      # split. Fails on wrong-account above 2.0%, coverage below 85%, new-when-existing above 5%,
      # or a regression against baselines/linking.json (coverage down more than 3 points, or
      # wrong-account up more than 0.5 point). Deterministic and $0: no models, no providers.
      - name: Linking eval, gate G1a (linker v1 with the second witness, confusable.v1 test split)
        run: pnpm --filter @earshot/evals eval:linking --linker v1 --split test --check --summary
      # Gate G2b and the understanding regression check (Phase 4 spec §6, WP10): all 200 debriefs
      # through each LLM adapter's offline cassettes (with seeded, labelled model-like errors),
      # linker v1, the normalizers, and the second witness. Fails on evidence coverage under 100%,
      # an end-to-end wrong-account rate above 2%, a key metric or an expected risk flag's catch
      # rate more than 3 points below baselines/understanding.json, stale cassettes, or a baseline
      # taken on other scripts. Also the likely-edit tiers' budgets (Phase 5 spec §4.4, WP4; gate
      # G2a's 95%): loud on more than the 18% interim ceiling, a card marker on more than 35%, or
      # fewer than 95% of the seeded errors marked.
      # Deterministic, a few seconds, and $0: no models, no providers.
      - name: Understanding eval, gate G2b and the tier budgets (200 debriefs, offline cassettes)
        run: pnpm --filter @earshot/evals eval:understanding --check --summary
      # The recap's checks in code (Phase 5 spec §4.9, WP10; ADR-0037): all 200 debriefs' recaps
      # through each LLM adapter's offline cassettes, built from the ground truth with seeded bad
      # sentences (quotes not in the transcript, or paraphrased) and invented lens quotes, then
      # `runRecap` and its checks. Fails unless every kept sentence carries evidence, every seeded
      # bad sentence was dropped, every recap has a headline, every ground-truth sentence was kept,
      # every invented lens quote came back "not mentioned", and the weak-support share is within
      # 3 points of baselines/recap.json, recorded on these scripts and labels. Deterministic, a
      # second or so, and $0: no models, no providers.
      - name: Recap eval, the quote checks (200 debriefs, offline cassettes)
        run: pnpm --filter @earshot/evals eval:recap --check --summary
      - name: Contracts are up to date
        run: |
          pnpm contracts:gen
          git diff --exit-code -- packages/core/schemas lab/src/earshot_lab/contracts

  ui:
    runs-on: ubuntu-latest
    # The fake-mic eval's subset plays five debriefs in real time, and a cold WAV cache renders
    # all thirty with Kokoro first (spec WP11 step 6).
    timeout-minutes: 30
    env:
      # A boolean only; the token itself goes to the Chromatic step alone. Secrets are empty on
      # fork PRs, so Chromatic is skipped there.
      HAS_CHROMATIC: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Chromatic's TurboSnap (onlyChanged) diffs against earlier builds' commits
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        working-directory: packages/ui
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium (the browser is cached; its system libraries aren't)
        working-directory: packages/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Stories, play functions, and axe checks (Vitest browser mode)
        run: pnpm --filter @earshot/ui test:storybook
      - name: Capture worklet, fake microphone, VAD, and the Debrief engine end to end (Vitest browser mode)
        run: pnpm --filter @earshot/voice test:browser
      # The review inbox is the `inbox` project (Phase 5 spec WP5, gate G3a): the test debriefs
      # reviewed by keyboard, the shortcuts' scope and switch, focus never on <body>, and axe in
      # every state in both themes. The pilot page is the `pilot` project (WP7): consent first, a
      # participant's run by keyboard to the results file, axe, a network check that it requests
      # only static files, and "Load sample debriefs" bringing pilot.v1 into the inbox. The
      # scripted reviewer is the `reviewer` project (WP8, gates G1a and G2a): /pilot?p=ci by
      # keyboard on a fake clock with the manifest's right answers. It fails on a seeded error
      # without its marker (loud for a flagged one, the name note for a silent one, in the
      # accessibility tree and on screen), more than 2 keys to accept, reject, or answer a question
      # or 3 to choose another record, focus on <body>, an axe violation in any state it reaches,
      # or a KLM estimate more than 10% above packages/evals/baselines/pilot-klm.json, and writes
      # its report (the KLM median against 4.0 s, the keys per decision, and the flag-follower
      # bound) to the job summary. $0: the static page, and nothing else.
      - name: Sign-in, the /demo replay at 8×, Settings → Keys, the demo CRM, the capture screen, the review inbox, the pilot page, and its scripted reviewer (next dev with in-process PGlite, the e2e edge Worker's cassettes, Chrome's fake microphone, the sample debriefs; no secrets, no providers)
        working-directory: apps/web
        run: pnpm exec playwright test e2e/sign-in.spec.ts e2e/demo.spec.ts e2e/keys.spec.ts e2e/capture e2e/inbox e2e/pilot e2e/pilot/scripted-reviewer.spec.ts
      # The fake-mic eval's subset (spec WP11 step 6; gate G3): its smoke test, then five of the
      # thirty debriefs. All thirty run in the eval workflow. No secrets, no providers.
      - name: Eval WAVs (Kokoro, from the cache, or rendered on a miss)
        uses: ./.github/actions/eval-wavs
      - name: Fake-mic smoke test and 5 eval debriefs (Kokoro WAVs through Chrome's fake microphone into the capture screen; the fake speech-to-text adapter and cassettes)
        id: eval
        working-directory: apps/web
        env:
          EARSHOT_EVAL_SCRIPTS: d001,d010,d016,d025,d030
          EARSHOT_EVAL_REPORT: ${{ runner.temp }}/eval/ui-report.json
        run: pnpm exec playwright test --project=capture-eval --workers=1
      - name: Eval report
        if: ${{ !cancelled() && steps.eval.outcome != 'skipped' }}
        env:
          REPORT: ${{ runner.temp }}/eval/ui-report.json
        run: |
          if [ -f "$REPORT" ]; then
            pnpm --filter @earshot/evals eval:report "$REPORT" --title "Fake-mic eval (the ui job's 5 debriefs)" \
              --baseline packages/evals/baselines/ci.json --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "No eval report: the eval stopped before any debrief ran (see the smoke test)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the eval report
        if: ${{ !cancelled() && steps.eval.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-ui-report
          path: ${{ runner.temp }}/eval
          retention-days: 14
          if-no-files-found: ignore
      - name: Publish to Chromatic
        if: env.HAS_CHROMATIC == 'true'
        uses: chromaui/action@5d18868345f53a8f61258ad393396c7e169100fd # v18.14.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook
          onlyChanged: true # TurboSnap; needs fetch-depth: 0
          exitZeroOnChanges: true # review visual changes in Chromatic instead of failing CI
          autoAcceptChanges: main

  # Deploys main to the production Workers once Cloudflare and Neon are configured.
  deploy-production:
    needs: [checks, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate dev (the seed-only parent of previews) and production
        env:
          DEV_URL: ${{ secrets.DATABASE_URL_DEV_DIRECT }}
          PROD_URL: ${{ secrets.DATABASE_URL_PRODUCTION_DIRECT }}
        run: |
          DATABASE_URL_DIRECT="$DEV_URL" pnpm --filter @earshot/db db:migrate
          DATABASE_URL_DIRECT="$DEV_URL" pnpm --filter @earshot/db db:stamp dev
          DATABASE_URL_DIRECT="$PROD_URL" pnpm --filter @earshot/db db:migrate
          DATABASE_URL_DIRECT="$PROD_URL" pnpm --filter @earshot/db db:stamp production
      - name: Render production wrangler configs (BETTER_AUTH_URL and EDGE_PUBLIC_URL are production's origins)
        env:
          SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
        run: pnpm --filter @earshot/scripts exec tsx render-wrangler.ts --target production --sha "$GITHUB_SHA" --workers-subdomain "$SUBDOMAIN"
      # The flush queues must exist before the edge Worker that binds them deploys (docs/adr/0024).
      - name: Create the flush queues if they're missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/edge
        run: |
          for queue in earshot-flush earshot-flush-dlq; do
            pnpm exec wrangler queues info "$queue" > /dev/null 2>&1 || pnpm exec wrangler queues create "$queue"
          done
      # The session socket fails closed without EARSHOT_SESSION_TICKET_SECRET, and the flush
      # consumer skips Postgres without DATABASE_URL. Empty values are dropped rather than uploaded.
      - name: Deploy the edge Worker with its secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          TICKET_SECRET: ${{ secrets.EARSHOT_SESSION_TICKET_SECRET }}
        working-directory: apps/edge
        run: |
          umask 077
          jq -n --arg u "$DB_URL" --arg t "$TICKET_SECRET" \
            '{DATABASE_URL: $u, EARSHOT_SESSION_TICKET_SECRET: $t} | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/edge.secrets.json"
          pnpm exec wrangler deploy --config wrangler.production.jsonc --secrets-file "$RUNNER_TEMP/edge.secrets.json"
          rm -f "$RUNNER_TEMP/edge.secrets.json"
      - name: Build the web Worker (next build, then the OpenNext bundle)
        run: pnpm turbo run build:worker --filter=@earshot/web
      # Auth fails closed without BETTER_AUTH_SECRET, and the session routes without
      # EARSHOT_SESSION_TICKET_SECRET; email and OAuth sign-in stay off without their pairs, and
      # the key vault without EARSHOT_VAULT_MASTER_KEY. Empty values are dropped rather than
      # uploaded.
      - name: Deploy the web Worker with its secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          GH_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.AUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
          VAULT_MASTER_KEY: ${{ secrets.EARSHOT_VAULT_MASTER_KEY }}
          TICKET_SECRET: ${{ secrets.EARSHOT_SESSION_TICKET_SECRET }}
        run: |
          umask 077
          jq -n --arg u "$DB_URL" --arg s "$AUTH_SECRET" --arg r "$RESEND_API_KEY" --arg f "$EMAIL_FROM" \
            --arg gi "$GH_CLIENT_ID" --arg gs "$GH_CLIENT_SECRET" \
            --arg oi "$GOOGLE_CLIENT_ID" --arg os "$GOOGLE_CLIENT_SECRET" --arg v "$VAULT_MASTER_KEY" \
            --arg t "$TICKET_SECRET" \
            '{DATABASE_URL: $u, BETTER_AUTH_SECRET: $s, RESEND_API_KEY: $r, EMAIL_FROM: $f,
              GITHUB_CLIENT_ID: $gi, GITHUB_CLIENT_SECRET: $gs, GOOGLE_CLIENT_ID: $oi, GOOGLE_CLIENT_SECRET: $os,
              EARSHOT_VAULT_MASTER_KEY: $v, EARSHOT_SESSION_TICKET_SECRET: $t}
             | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/web.secrets.json"
          pnpm exec opennextjs-cloudflare deploy --config wrangler.production.jsonc -- --secrets-file "$RUNNER_TEMP/web.secrets.json"
          rm -f "$RUNNER_TEMP/web.secrets.json"
      - name: Smoke test production
        working-directory: apps/web
        env:
          BASE_URL: https://earshot-web.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev
          EXPECT_BRANCH: production
          EXPECT_SHA: ${{ github.sha }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=smoke
