name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Install exactly what lab/uv.lock pins; never re-lock in CI.
  UV_FROZEN: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # turbo --affected compares against the base branch
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project lab
      - name: Format and lint (Biome)
        run: pnpm ci:check
      - name: Lint, typecheck, test, build (including the OpenNext Worker bundle)
        run: pnpm turbo run lint typecheck test build build:worker ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Contracts are up to date
        run: |
          pnpm contracts:gen
          git diff --exit-code -- packages/core/schemas lab/src/earshot_lab/contracts

  # Deploys main to the production Workers once Cloudflare and Neon are configured.
  deploy-production:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate dev (the seed-only parent of previews) and production
        env:
          DEV_URL: ${{ secrets.DATABASE_URL_DEV_DIRECT }}
          PROD_URL: ${{ secrets.DATABASE_URL_PRODUCTION_DIRECT }}
        run: |
          DATABASE_URL_DIRECT="$DEV_URL" pnpm --filter @earshot/db db:migrate
          DATABASE_URL_DIRECT="$DEV_URL" pnpm --filter @earshot/db db:stamp dev
          DATABASE_URL_DIRECT="$PROD_URL" pnpm --filter @earshot/db db:migrate
          DATABASE_URL_DIRECT="$PROD_URL" pnpm --filter @earshot/db db:stamp production
      - name: Render production wrangler configs
        run: pnpm --filter @earshot/scripts exec tsx render-wrangler.ts --target production --sha "$GITHUB_SHA"
      - name: Deploy the edge Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/edge
        run: pnpm exec wrangler deploy --config wrangler.production.jsonc
      - name: Build the web Worker (next build, then the OpenNext bundle)
        run: pnpm turbo run build:worker --filter=@earshot/web
      - name: Deploy the web Worker with its database secret
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          umask 077
          jq -n --arg u "$DB_URL" '{DATABASE_URL: $u}' > "$RUNNER_TEMP/web.secrets.json"
          pnpm exec opennextjs-cloudflare deploy --config wrangler.production.jsonc -- --secrets-file "$RUNNER_TEMP/web.secrets.json"
          rm -f "$RUNNER_TEMP/web.secrets.json"
      - name: Smoke test production
        working-directory: apps/web
        env:
          BASE_URL: https://earshot-web.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev
          EXPECT_BRANCH: production
          EXPECT_SHA: ${{ github.sha }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=smoke
