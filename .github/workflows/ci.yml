name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Install exactly what lab/uv.lock pins; never re-lock in CI.
  UV_FROZEN: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # turbo --affected compares against the base branch
          persist-credentials: false
      # A migration on the base branch may already have run against a database, and editing it
      # would leave that database out of step with the file (docs/adr/0019). New migration files
      # and changes under meta/ pass.
      - name: Merged migrations are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changes=$(git diff --diff-filter=MDR --name-status "origin/${BASE_REF}...HEAD" -- 'packages/db/migrations/*.sql')
          if [ -n "$changes" ]; then
            while IFS=$'\t' read -r status file _; do
              echo "::error file=${file}::Migrations are immutable once merged, and ${file} is already on ${BASE_REF} (git status ${status}). Add a new migration instead of editing, renaming, or deleting it."
            done <<< "$changes"
            exit 1
          fi
          echo "No migration from ${BASE_REF} was edited, renamed, or deleted."
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project lab
      - name: Format and lint (Biome)
        run: pnpm ci:check
      - name: Lint, typecheck, test, build (including the OpenNext Worker bundle)
        run: pnpm turbo run lint typecheck test build build:worker ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Contracts are up to date
        run: |
          pnpm contracts:gen
          git diff --exit-code -- packages/core/schemas lab/src/earshot_lab/contracts

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A boolean only; the token itself goes to the Chromatic step alone. Secrets are empty on
      # fork PRs, so Chromatic is skipped there.
      HAS_CHROMATIC: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Chromatic's TurboSnap (onlyChanged) diffs against earlier builds' commits
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the Playwright version
        id: playwright
        working-directory: packages/ui
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright Chromium (the browser is cached; its system libraries aren't)
        working-directory: packages/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Stories, play functions, and axe checks (Vitest browser mode)
        run: pnpm --filter @earshot/ui test:storybook
      - name: Sign-in and demo pages render and pass axe (next dev, in-process PGlite, no secrets)
        working-directory: apps/web
        run: pnpm exec playwright test e2e/sign-in.spec.ts
      - name: Publish to Chromatic
        if: env.HAS_CHROMATIC == 'true'
        uses: chromaui/action@5d18868345f53a8f61258ad393396c7e169100fd # v18.14.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook
          onlyChanged: true # TurboSnap; needs fetch-depth: 0
          exitZeroOnChanges: true # review visual changes in Chromatic instead of failing CI
          autoAcceptChanges: main

  # Deploys main to the production Workers once Cloudflare and Neon are configured.
  deploy-production:
    needs: [checks, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate dev (the seed-only parent of previews) and production
        env:
          DEV_URL: ${{ secrets.DATABASE_URL_DEV_DIRECT }}
          PROD_URL: ${{ secrets.DATABASE_URL_PRODUCTION_DIRECT }}
        run: |
          DATABASE_URL_DIRECT="$DEV_URL" pnpm --filter @earshot/db db:migrate
          DATABASE_URL_DIRECT="$DEV_URL" pnpm --filter @earshot/db db:stamp dev
          DATABASE_URL_DIRECT="$PROD_URL" pnpm --filter @earshot/db db:migrate
          DATABASE_URL_DIRECT="$PROD_URL" pnpm --filter @earshot/db db:stamp production
      - name: Render production wrangler configs (BETTER_AUTH_URL is the production origin)
        env:
          SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
        run: pnpm --filter @earshot/scripts exec tsx render-wrangler.ts --target production --sha "$GITHUB_SHA" --workers-subdomain "$SUBDOMAIN"
      - name: Deploy the edge Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/edge
        run: pnpm exec wrangler deploy --config wrangler.production.jsonc
      - name: Build the web Worker (next build, then the OpenNext bundle)
        run: pnpm turbo run build:worker --filter=@earshot/web
      # Auth fails closed without BETTER_AUTH_SECRET; email and OAuth sign-in stay off without
      # their pairs. Empty values are dropped rather than uploaded.
      - name: Deploy the web Worker with its secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          GH_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.AUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.AUTH_GOOGLE_CLIENT_SECRET }}
        run: |
          umask 077
          jq -n --arg u "$DB_URL" --arg s "$AUTH_SECRET" --arg r "$RESEND_API_KEY" --arg f "$EMAIL_FROM" \
            --arg gi "$GH_CLIENT_ID" --arg gs "$GH_CLIENT_SECRET" \
            --arg oi "$GOOGLE_CLIENT_ID" --arg os "$GOOGLE_CLIENT_SECRET" \
            '{DATABASE_URL: $u, BETTER_AUTH_SECRET: $s, RESEND_API_KEY: $r, EMAIL_FROM: $f,
              GITHUB_CLIENT_ID: $gi, GITHUB_CLIENT_SECRET: $gs, GOOGLE_CLIENT_ID: $oi, GOOGLE_CLIENT_SECRET: $os}
             | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/web.secrets.json"
          pnpm exec opennextjs-cloudflare deploy --config wrangler.production.jsonc -- --secrets-file "$RUNNER_TEMP/web.secrets.json"
          rm -f "$RUNNER_TEMP/web.secrets.json"
      - name: Smoke test production
        working-directory: apps/web
        env:
          BASE_URL: https://earshot-web.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev
          EXPECT_BRANCH: production
          EXPECT_SHA: ${{ github.sha }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=smoke
