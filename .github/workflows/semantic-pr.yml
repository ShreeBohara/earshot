name: semantic-pr

# Squash merges use the PR title as the commit message, so the title must be a
# Conventional Commit. `pull_request` (not `pull_request_target`) is enough to read titles.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
