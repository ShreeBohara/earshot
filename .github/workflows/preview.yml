name: preview

# A full stack per PR: earshot-edge-pr-N + earshot-web-pr-N Workers, the edge Worker's
# earshot-flush-pr-N queues, and a Neon branch preview/pr-N forked from the seed-only `dev`
# branch (docs/adr/0017). Torn down by
# preview-cleanup.yml when the PR closes; janitor.yml and Neon branch expiry are backstops.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Same-repo PRs only (fork PRs never see secrets), and only once Cloudflare is configured.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Branch expiry (14 days)
        id: expiry
        run: echo "at=$(date -u -d '+14 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # On the first run, check that this action's outputs show as *** in the logs (this repo's
      # logs are public). If they don't, replace this step with one shell step that fetches the
      # URLs with neonctl and masks them before anything else uses them.
      - name: Neon branch preview/pr-N from dev
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6 (6.3.1)
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: dev
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          expires_at: ${{ steps.expiry.outputs.at }}

      - name: Migrate and stamp the branch
        env:
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: |
          pnpm --filter @earshot/db db:migrate
          pnpm --filter @earshot/db db:stamp "preview/pr-$PR"

      - name: Render this PR's wrangler configs (BETTER_AUTH_URL and EDGE_PUBLIC_URL are the preview's own origins)
        run: pnpm --filter @earshot/scripts exec tsx render-wrangler.ts --target "pr-$PR" --sha "$SHA" --workers-subdomain "$SUBDOMAIN"

      # The edge Worker produces to and consumes this PR's own flush queues (docs/adr/0024), and
      # its deploy fails if they don't exist. Idempotent, so the next push's run passes too. The
      # CI token needs Queues edit access; preview-cleanup.yml deletes the queues with the PR.
      - name: Create this PR's flush queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: apps/edge
        run: |
          for queue in "earshot-flush-pr-$PR" "earshot-flush-pr-$PR-dlq"; do
            pnpm exec wrangler queues info "$queue" > /dev/null 2>&1 || pnpm exec wrangler queues create "$queue"
          done

      # The session socket fails closed without EARSHOT_SESSION_TICKET_SECRET (the same value the
      # web Worker signs with), and the flush consumer skips Postgres without DATABASE_URL, this
      # PR's Neon branch. WEB_ORIGIN is a var, rendered above. Empty values are dropped.
      - name: Deploy the edge Worker with its secrets (it owns the Durable Objects, so it goes first)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ steps.neon.outputs.db_url_pooled }}
          TICKET_SECRET: ${{ secrets.EARSHOT_SESSION_TICKET_SECRET }}
        working-directory: apps/edge
        run: |
          umask 077
          jq -n --arg u "$DB_URL" --arg t "$TICKET_SECRET" \
            '{DATABASE_URL: $u, EARSHOT_SESSION_TICKET_SECRET: $t} | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/edge.secrets.json"
          pnpm exec wrangler deploy --config "wrangler.pr-$PR.jsonc" --secrets-file "$RUNNER_TEMP/edge.secrets.json"
          rm -f "$RUNNER_TEMP/edge.secrets.json"

      - name: Build the web Worker (next build, then the OpenNext bundle)
        run: pnpm turbo run build:worker --filter=@earshot/web

      # Auth fails closed without BETTER_AUTH_SECRET, the session routes without
      # EARSHOT_SESSION_TICKET_SECRET, email sign-in without the Resend pair, and the key vault
      # without EARSHOT_VAULT_MASTER_KEY: the preview environment's copy is dev's key, since
      # preview branches fork from dev with its sealed rows (docs/vault-key-rotation.md). Empty
      # values are dropped rather than uploaded.
      - name: Deploy the web Worker with its secrets
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_URL: ${{ steps.neon.outputs.db_url_pooled }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          VAULT_MASTER_KEY: ${{ secrets.EARSHOT_VAULT_MASTER_KEY }}
          TICKET_SECRET: ${{ secrets.EARSHOT_SESSION_TICKET_SECRET }}
        run: |
          umask 077
          jq -n --arg u "$DB_URL" --arg s "$AUTH_SECRET" --arg r "$RESEND_API_KEY" --arg f "$EMAIL_FROM" \
            --arg v "$VAULT_MASTER_KEY" --arg t "$TICKET_SECRET" \
            '{DATABASE_URL: $u, BETTER_AUTH_SECRET: $s, RESEND_API_KEY: $r, EMAIL_FROM: $f,
              EARSHOT_VAULT_MASTER_KEY: $v, EARSHOT_SESSION_TICKET_SECRET: $t}
             | with_entries(select(.value != ""))' \
            > "$RUNNER_TEMP/web.secrets.json"
          pnpm exec opennextjs-cloudflare deploy --config "wrangler.pr-$PR.jsonc" -- --secrets-file "$RUNNER_TEMP/web.secrets.json"
          rm -f "$RUNNER_TEMP/web.secrets.json"

      - name: Smoke test the preview
        working-directory: apps/web
        env:
          BASE_URL: https://earshot-web-pr-${{ github.event.pull_request.number }}.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev
          EXPECT_BRANCH: preview/pr-${{ github.event.pull_request.number }}
          EXPECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=smoke

      - name: Comment the preview URLs on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          WEB="https://earshot-web-pr-$PR.$SUBDOMAIN.workers.dev"
          EDGE="https://earshot-edge-pr-$PR.$SUBDOMAIN.workers.dev/health"
          BODY=$(printf '### Preview for %s\n\n| | |\n|---|---|\n| Web | %s |\n| Edge health | %s |\n| Neon branch | `preview/pr-%s` |\n| Smoke test | %s |\n\n<sub>Deleted when this PR closes.</sub>\n' "${SHA:0:7}" "$WEB" "$EDGE" "$PR" "$OUTCOME")
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --edit-last --body "$BODY" \
            || gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$BODY"
