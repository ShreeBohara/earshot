[project]
name = "earshot-lab"
version = "0.0.0"
description = "Earshot's ML lab: generated contracts, benchmarks, and experiments."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["pydantic>=2.11"]

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.90",
  "pytest>=8.4",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earshot_lab"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/earshot_lab/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
